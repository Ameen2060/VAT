[project]
name = "vat-api"
version = "0.1.0"
description = "UAE VAT Compliance Platform — API and rule engine"
requires-python = ">=3.11"
# Runtime dependencies. These are what the Vercel Python builder installs (it reads
# pyproject via uv), so the full serverless runtime set lives here — Postgres driver,
# AI SDK, document parsing (PyMuPDF/openpyxl/docx/pypdf/pillow) and report generation.
# The heavy OCR stack (rapidocr-onnxruntime/onnxruntime/opencv) stays in the optional
# `parsing`/`all` extras below so it is EXCLUDED from the serverless bundle (too large);
# scanned-image OCR is unavailable on Vercel, text-based PDFs still parse fully.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "anthropic>=0.39",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pillow>=10.3",
    "pymupdf>=1.24",
    "reportlab>=4.2",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
# Installed when running against Postgres / object storage / AI. Kept optional so the
# rule engine and tests run with a minimal install.
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
storage = ["boto3>=1.34"]
ai = ["anthropic>=0.39", "openai>=1.40"]
# Document parsing + OCR for the extraction pipeline.
parsing = [
    "pypdf>=4.2", "openpyxl>=3.1", "python-docx>=1.1", "pillow>=10.3",
    "pymupdf>=1.24", "rapidocr-onnxruntime>=1.3",
]
# Report generation.
report = ["reportlab>=4.2"]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5"]
# Convenience: everything needed to run the full pipeline (used by the Docker image).
all = [
    "psycopg[binary]>=3.2", "pgvector>=0.3", "boto3>=1.34",
    "anthropic>=0.39", "openai>=1.40",
    "pypdf>=4.2", "openpyxl>=3.1", "python-docx>=1.1", "pillow>=10.3",
    "pymupdf>=1.24", "rapidocr-onnxruntime>=1.3",
    "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
