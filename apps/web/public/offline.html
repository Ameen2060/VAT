<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · VAT Compliance</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f7f8fa; color: #111827; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0a0e14; color: #e5e7eb; } }
      .card { max-width: 380px; text-align: center; }
      .logo {
        width: 64px; height: 64px; border-radius: 16px; background: #0f5b9e; color: #fff;
        display: grid; place-items: center; font-weight: 800; font-size: 34px; margin: 0 auto 20px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b7280; margin: 0 0 24px; line-height: 1.5; }
      @media (prefers-color-scheme: dark) { p { color: #94a3b8; } }
      button {
        appearance: none; border: 0; background: #0f5b9e; color: #fff; font-weight: 600;
        padding: 12px 20px; border-radius: 10px; font-size: 15px; cursor: pointer; min-height: 44px;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">V</div>
      <h1>You're offline</h1>
      <p>VAT Compliance needs an internet connection to load your accounting data securely. Please reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
